name: AutoDraw

# Builds AutoDraw.exe (Windows) and keeps it as a downloadable artifact.

on:
  push:
    paths:
      - "AutoDraw/**"
      - ".github/workflows/autodraw.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: AutoDraw

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller==6.16.0 pytest
      - name: Tests (turning pictures into strokes)
        run: python -m pytest -q test_strokes.py
      - name: Build AutoDraw.exe
        run: pyinstaller --onefile --windowed --name AutoDraw --collect-all tkinterdnd2 --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 autodraw.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDraw
          path: AutoDraw/dist/AutoDraw.exe
      - name: Publish download link
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=autodraw-latest
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" dist/AutoDraw.exe --prerelease --target "$GITHUB_SHA" \
            --title "AutoDraw (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download AutoDraw.exe and run it (Windows)."
