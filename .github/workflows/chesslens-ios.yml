name: ChessLens iOS

on:
  push:
    paths:
      - "ChessLens/**"
      - ".github/workflows/chesslens-ios.yml"
  pull_request:
    paths:
      - "ChessLens/**"
      - ".github/workflows/chesslens-ios.yml"
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Sign the app and upload it to TestFlight"
        type: boolean
        default: true
      app_version:
        description: "Version shown in TestFlight (leave empty for 1.0.0)"
        type: string
        required: false

concurrency:
  group: chesslens-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ChessLens

jobs:
  build:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && 'Build & upload to TestFlight' || 'Build (unsigned check)' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Stockfish neural networks
        run: ./scripts/download-nnue.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ChessLens.xcodeproj -scheme ChessLens

      - name: Build (unsigned)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight) }}
        run: |
          xcodebuild build -quiet \
            -project ChessLens.xcodeproj \
            -scheme ChessLens \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Check signing secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT APPLE_TEAM_ID BUNDLE_ID MATCH_GIT_URL MATCH_GIT_TOKEN MATCH_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret $name (see ChessLens/README.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Set up Ruby
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ChessLens

      - name: Build, sign and upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
          APP_VERSION: ${{ inputs.app_version }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane ios beta

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ChessLens/build.log
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
