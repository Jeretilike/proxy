name: ChessLens iOS

# Builds the app on GitHub's Mac runners (no Mac or paid Apple account needed) and publishes an
# unsigned ChessLens.ipa. Install it on the iPhone with SideStore, which signs it with a free Apple ID.

on:
  push:
    paths:
      - "ChessLens/**"
      - ".github/workflows/chesslens-ios.yml"
  pull_request:
    paths:
      - "ChessLens/**"
      - ".github/workflows/chesslens-ios.yml"
  workflow_dispatch:

concurrency:
  group: chesslens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: ChessLens

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Stockfish neural networks
        run: ./scripts/download-nnue.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build -quiet \
            -project ChessLens.xcodeproj \
            -scheme ChessLens \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Package ChessLens.ipa
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/ChessLens.app
          test -d "$app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../ChessLens.ipa Payload)
          ls -lh build/ChessLens.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ChessLens-ipa
          path: ChessLens/build/ChessLens.ipa

      - name: Publish download link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=chesslens-latest
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" build/ChessLens.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "ChessLens (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Download ChessLens.ipa on your iPhone and open it with SideStore (see ChessLens/README.md)."
